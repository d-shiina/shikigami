<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>サンプル商事 受注管理システム - 在庫一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><strong>サンプル商事 受注管理システム</strong><span>在庫</span></header>
  <main>
    <nav><a href="orders.html">受注一覧</a><a href="stock.html">在庫一覧</a></nav>
    <h1>在庫一覧</h1>
    <p id="loading">読み込み中…</p>
    <table aria-label="在庫" hidden>
      <thead><tr><th>商品コード</th><th>商品名</th><th>在庫数</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
  <script>
    // The stock list loads slowly (no login needed for this page).
    setTimeout(() => {
      const tbody = document.getElementById("rows");
      for (const s of STOCK) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${s.code}</td><td>${s.name}</td><td class="num">${s.qty}</td>`;
        tbody.appendChild(tr);
      }
      document.getElementById("loading").remove();
      document.querySelector("table").hidden = false;
    }, 800);
  </script>
</body>
</html>
