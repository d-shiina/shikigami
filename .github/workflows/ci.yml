name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Tauri's build script requires the frontend dist directory to exist.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shikigami/studio build
      - name: Demo site serves pages (Windows paths)
        if: runner.os == 'Windows'
        run: pnpm --filter @shikigami/browser-adapter exec vitest run test/demo-site.test.ts
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: target/node-dist
          key: node-dist-${{ hashFiles('apps/studio/scripts/bundle-node.mjs') }}
      - name: Bundled Node.js runs the browser adapter (installer contents)
        if: runner.os == 'Windows'
        run: pnpm studio:bundle-node
      - uses: actions/cache@v4
        with:
          path: target/ocr-dist
          key: ocr-dist-${{ runner.os }}-${{ hashFiles('apps/studio/scripts/bundle-ocr.mjs') }}
      - name: OCR models and ONNX Runtime (the OCR tests use them)
        run: pnpm studio:bundle-ocr
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          SHIKIGAMI_SNAPSHOT_DIR: ${{ runner.temp }}/dialogs
      # Pictures of the dialog.* dialogs, drawn by the Windows test.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: dialogs
          path: ${{ runner.temp }}/dialogs
          if-no-files-found: ignore

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser adapter tests
        run: pnpm --filter @shikigami/browser-adapter exec playwright-core install --with-deps chromium
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Generated TypeScript types are up to date
        run: pnpm --filter @shikigami/schema exec node scripts/generate.mjs --check

  contract:
    name: Contract changes are in the changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # schemas/ holds the public contracts (docs/compatibility.md); a change
      # there must be written up for users.
      - name: CHANGELOG.md is updated when schemas/ changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"..."$HEAD")
          if echo "$changed" | grep -q '^schemas/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::schemas/ changed (a public contract). Add an entry under 未リリース in CHANGELOG.md; docs/compatibility.md says what is allowed."
            exit 1
          fi

  dco:
    name: DCO sign-off
    # Outside contributors sign off every commit (CONTRIBUTING.md); the
    # maintainers hold the copyright already.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by line. Use git commit -s (see CONTRIBUTING.md)."
              fail=1
            fi
          done
          exit $fail
