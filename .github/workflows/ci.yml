name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in the test builds: they compile and link faster (above all
  # on Windows) and the cache is smaller. A panic still names its file and line.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies and ODBC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev unixodbc-dev libsqliteodbc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Tauri's build script requires the frontend dist directory to exist.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spellsheet/studio build
      - name: Demo site serves pages (Windows paths)
        if: runner.os == 'Windows'
        run: pnpm --filter @spellsheet/browser-adapter exec vitest run test/demo-site.test.ts
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: target/node-dist
          key: node-dist-${{ hashFiles('apps/studio/scripts/bundle-node.mjs') }}
      - name: Bundled Node.js runs the browser adapter (installer contents)
        if: runner.os == 'Windows'
        run: pnpm studio:bundle-node
      - uses: actions/cache@v4
        with:
          path: target/ocr-dist
          key: ocr-dist-${{ runner.os }}-${{ hashFiles('apps/studio/scripts/bundle-ocr.mjs') }}
      - name: OCR models and ONNX Runtime (the OCR tests use them)
        run: pnpm studio:bundle-ocr
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          SPELLSHEET_SNAPSHOT_DIR: ${{ runner.temp }}/dialogs
          # The db.* tests run SQL through the SQLite ODBC driver installed above.
          SPELLSHEET_REQUIRE_ODBC: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Example extensions work against a stand-in service
        run: node --test examples/plugins/azure-ocr/test.mjs
      - name: Tutorial examples run, and their bundles are current
        shell: bash
        run: |
          node examples/build-tutorials.mjs
          git diff --exit-code -- examples/tutorials
          for t in examples/tutorials/*.spellsheet.json; do
            cargo run -q -p spellsheet-cli -- run "$t"
          done
      # An experiment, not a gate: does an Edge IE mode page show its
      # elements to UI Automation? The test reports what it saw as annotations.
      # It takes about 3 minutes, so it runs on main only, not on every PR.
      - name: Edge IE mode through UI Automation (experiment)
        if: runner.os == 'Windows' && github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          # Windows Server turns on IE Enhanced Security Configuration,
          # which blocks pages on the IE engine; a desktop PC has it off.
          foreach ($id in '{A509B1A7-37EF-4b3f-8CFC-4F3A74704073}', '{A509B1A8-37EF-4b3f-8CFC-4F3A74704073}') {
            $esc = "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\$id"
            if (Test-Path $esc) { Set-ItemProperty $esc IsInstalled 0 -Type DWord }
          }
          Get-Process iexplore, msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:SPELLSHEET_IE_SHOTS = Join-Path $env:RUNNER_TEMP 'ie-mode'
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $key -Force | Out-Null
          $sites = Join-Path $env:RUNNER_TEMP 'ie-sites.xml'
          '<site-list version="1"><site url="127.0.0.1:8799"><compat-mode>Default</compat-mode><open-in>IE11</open-in></site></site-list>' | Set-Content -Encoding utf8 $sites
          Set-ItemProperty $key InternetExplorerIntegrationLevel 1 -Type DWord
          Set-ItemProperty $key InternetExplorerIntegrationSiteList ('file:///' + $sites.Replace('\', '/'))
          Set-ItemProperty $key InternetExplorerIntegrationTestingAllowed 1 -Type DWord
          Set-ItemProperty $key HideFirstRunExperience 1 -Type DWord
          cargo test -p spellsheet-desktop --test ie_mode -- --ignored --nocapture
      # An experiment, not a gate: the OCR benchmark (Japanese business
      # screens, crates/spellsheet-desktop/src/ocr_bench.rs) with PaddleOCR
      # and with Windows OCR on the same machine. The results are notices on
      # the run. Installing Windows OCR's Japanese pack takes about 15 minutes,
      # so it runs only on pull requests whose title names OCR.
      - name: OCR benchmark, PaddleOCR and Windows OCR (experiment)
        if: runner.os == 'Windows' && contains(github.event.pull_request.title, 'OCR')
        continue-on-error: true
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ja-JP~0.0.1.0" | Out-Null
          cargo test -p spellsheet-desktop --lib ocr_bench -- --ignored --nocapture
      # Pictures of the dialog.* dialogs, drawn by the Windows test.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: dialogs
          path: ${{ runner.temp }}/dialogs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name == 'push' && always()
        with:
          name: ie-mode
          path: ${{ runner.temp }}/ie-mode
          if-no-files-found: ignore

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser adapter tests
        run: pnpm --filter @spellsheet/browser-adapter exec playwright-core install --with-deps chromium
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Generated TypeScript types are up to date
        run: pnpm --filter @spellsheet/schema exec node scripts/generate.mjs --check
      - name: The manual builds and every link in it leads somewhere
        run: pnpm --filter @spellsheet/manual check

  contract:
    name: Contract changes are in the changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # schemas/ holds the public contracts (docs/compatibility.md); a change
      # there must be written up for users.
      - name: CHANGELOG.md is updated when schemas/ changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"..."$HEAD")
          if echo "$changed" | grep -q '^schemas/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::schemas/ changed (a public contract). Add an entry under 未リリース in CHANGELOG.md; docs/compatibility.md says what is allowed."
            exit 1
          fi

  dco:
    name: DCO sign-off
    # Outside contributors sign off every commit (CONTRIBUTING.md); the
    # maintainers hold the copyright already.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by line. Use git commit -s (see CONTRIBUTING.md)."
              fail=1
            fi
          done
          exit $fail
