name: Pages

# The product site moved to https://spellsheet.github.io/, published by the
# spellsheet/spellsheet.github.io repository from site/ (and the manual) in
# this repository. This repository's own page, the old address
# https://spellsheet.github.io/spellsheet/, only sends visitors there:
# site-moved/index.html is published as every page (404.html too), keeping
# the rest of the address.

on:
  push:
    branches: [main]
    paths:
      - "site-moved/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Every page leads to the new address
        run: |
          set -euo pipefail
          mkdir public
          cp site-moved/index.html public/index.html
          cp site-moved/index.html public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
