name: Pages

# The product site (site/) on GitHub Pages: the introduction and the
# download page, and the manual (apps/manual, built with Starlight) under
# manual/. It is published again after each release so release.json names
# the newest installer; the page also checks the GitHub API itself.
#
# Once per repository: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/manual/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @spellsheet/manual
      # The manual's addresses start with the repository's page:
      # https://<owner>.github.io/<repository>/manual/.
      - name: Build the manual into site/manual
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          export MANUAL_SITE="https://${owner,,}.github.io"
          export MANUAL_BASE="/${REPOSITORY#*/}/manual"
          pnpm --filter @spellsheet/manual check
          cp -r apps/manual/dist site/manual
      - name: Write release.json (the latest installer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > latest.json 2>/dev/null; then
            jq '{tag: .tag_name, published: .published_at,
                 asset: ([.assets[] | select(.name | test("_x64-setup\\.exe$"))
                          | {name, size, url: .browser_download_url, digest}] | first)}' \
              latest.json > site/release.json
          else
            echo '{}' > site/release.json
          fi
          cat site/release.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
