[workspace]
resolver = "3"
members = [
    "crates/spellsheet-core",
    "crates/spellsheet-runtime",
    "crates/spellsheet-cli",
    "crates/spellsheet-mcp",
    "crates/spellsheet-browser",
    "crates/spellsheet-secrets",
    "crates/spellsheet-adapters",
    "crates/spellsheet-desktop",
    "crates/spellsheet-plugins",
    "crates/spellsheet-files",
    "crates/spellsheet-system",
    "crates/spellsheet-pdf",
    "crates/spellsheet-excel",
    "crates/spellsheet-word",
    "crates/spellsheet-com",
    "crates/spellsheet-mail",
    "crates/spellsheet-db",
    "crates/spellsheet-agent",
    "crates/spellsheet-manager",
    "apps/studio/src-tauri",
]

[workspace.package]
version = "0.1.21"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/spellsheet/spellsheet"

[workspace.dependencies]
spellsheet-core = { path = "crates/spellsheet-core" }
spellsheet-runtime = { path = "crates/spellsheet-runtime" }
spellsheet-mcp = { path = "crates/spellsheet-mcp" }
spellsheet-browser = { path = "crates/spellsheet-browser" }
spellsheet-secrets = { path = "crates/spellsheet-secrets" }
spellsheet-adapters = { path = "crates/spellsheet-adapters" }
spellsheet-desktop = { path = "crates/spellsheet-desktop" }
spellsheet-plugins = { path = "crates/spellsheet-plugins" }
spellsheet-files = { path = "crates/spellsheet-files" }
spellsheet-system = { path = "crates/spellsheet-system" }
spellsheet-pdf = { path = "crates/spellsheet-pdf" }
spellsheet-excel = { path = "crates/spellsheet-excel" }
spellsheet-word = { path = "crates/spellsheet-word" }
spellsheet-com = { path = "crates/spellsheet-com" }
spellsheet-mail = { path = "crates/spellsheet-mail" }
spellsheet-db = { path = "crates/spellsheet-db" }
spellsheet-agent = { path = "crates/spellsheet-agent" }
spellsheet-manager = { path = "crates/spellsheet-manager" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
schemars = { version = "1.2.3", features = ["preserve_order"] }
jsonschema = { version = "0.60.2", default-features = false }
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
notify = "8.2.1"
regex = "1.13.1"
semver = "1.0.28"
jiff = "0.2.38"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
dirs = "7.0.0"
base64 = "0.22.1"
rmcp = { version = "3.8.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
# No cross-crate LTO: it made each release binary link for minutes (the
# release build twice: CLI and Writer), for no speed a user would notice.
lto = false
