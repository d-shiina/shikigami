[package]
name = "shikigami-studio"
description = "Shikigami RPA Studio (Tauri 2 desktop app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Only the rlib: the staticlib and cdylib that the Tauri template adds are for
# iOS/Android, and each one is a full extra link (with LTO) of the whole app.
[lib]
name = "shikigami_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
shikigami-core.workspace = true
shikigami-runtime.workspace = true
shikigami-adapters.workspace = true
shikigami-desktop.workspace = true
shikigami-secrets.workspace = true
shikigami-agent.workspace = true
shikigami-system.workspace = true
shikigami-plugins.workspace = true
base64.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-updater = "2.14.1"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
