[package]
name = "shikigami-studio"
description = "Shikigami RPA Writer (Tauri 2 desktop app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Only the rlib: the staticlib and cdylib that the Tauri template adds are for
# iOS/Android, and each one is a full extra link (with LTO) of the whole app.
[lib]
name = "shikigami_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
shikigami-core.workspace = true
shikigami-runtime.workspace = true
shikigami-adapters.workspace = true
shikigami-desktop.workspace = true
shikigami-secrets.workspace = true
shikigami-agent.workspace = true
shikigami-system.workspace = true
shikigami-plugins.workspace = true
base64.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-updater = "2.14.1"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.5.5"
# Windows notifications when a run waits for the person (attention.rs), and
# Runner's own taskbar button (runner.rs).
windows = { version = "0.62.2", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
