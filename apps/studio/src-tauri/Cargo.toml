[package]
name = "spellsheet-studio"
description = "SpellSheet Writer (Tauri 2 desktop app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Only the rlib: the staticlib and cdylib that the Tauri template adds are for
# iOS/Android, and each one is a full extra link (with LTO) of the whole app.
[lib]
name = "spellsheet_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
spellsheet-core.workspace = true
spellsheet-runtime.workspace = true
spellsheet-adapters.workspace = true
spellsheet-desktop.workspace = true
spellsheet-secrets.workspace = true
spellsheet-agent.workspace = true
spellsheet-system.workspace = true
spellsheet-plugins.workspace = true
base64.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-updater = "2.14.1"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.5.5"
# Windows notifications when a run waits for the person (attention.rs).
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
