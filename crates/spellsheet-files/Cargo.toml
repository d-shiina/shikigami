[package]
name = "spellsheet-files"
description = "File and folder steps for SpellSheet (file.*): text, CSV, copy/move/delete, listing and zip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
spellsheet-core.workspace = true
spellsheet-runtime.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
jiff.workspace = true
csv = "1.4.0"
encoding_rs = "0.8.35"
glob = "0.3.4"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# The workspace forbids unsafe code; reading console output in the console's
# code page calls Windows APIs, so it is allowed only in
# `encoding::windows_code_page`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_System_Console"] }
