[package]
name = "shikigami-com"
description = "COM automation helpers for Shikigami adapters that drive Office apps (Excel macros, Outlook): late-bound IDispatch calls on a dedicated apartment thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shikigami-runtime.workspace = true
serde_json.workspace = true
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

# The workspace forbids unsafe code; COM needs it, so it is allowed only
# inside the `dispatch` module (see src/dispatch.rs).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
