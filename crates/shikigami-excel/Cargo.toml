[package]
name = "shikigami-excel"
description = "Excel workbook steps for Shikigami (excel.*): read and write .xlsx files directly, without Excel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shikigami-core.workspace = true
shikigami-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
umya-spreadsheet = { version = "3.1.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

# The workspace forbids unsafe code; COM needs it, so it is allowed only
# inside the `com` module (see src/com.rs).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
