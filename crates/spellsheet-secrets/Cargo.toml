[package]
name = "spellsheet-secrets"
description = "SpellSheet secret vault: login data encrypted in the workspace, key held by Windows Credential Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
spellsheet-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tempfile.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
aes-gcm = "0.10.3"
base64 = "0.22.1"
getrandom = "0.3.4"
hmac = "0.13.0"
sha1 = "0.10.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# The workspace forbids unsafe code; reading Windows Credential Manager
# needs it, so it is allowed only inside the `wincred` module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
