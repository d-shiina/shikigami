[package]
name = "spellsheet-db"
description = "Database steps for SpellSheet (db.*): run SQL through ODBC (SQL Server, Oracle, Access, PostgreSQL, ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
spellsheet-core.workspace = true
spellsheet-runtime.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
odbc-api = { version = "29.3.0", default-features = false, features = ["odbc_version_3_80"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
