[package]
name = "shikigami-manager"
description = "A small reference management server for Shikigami agents (protocol v1, docs/remote.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shikigami-core.workspace = true
shikigami-runtime.workspace = true
shikigami-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
time.workspace = true
uuid.workspace = true
ring = "0.17.14"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

[dev-dependencies]
tempfile.workspace = true
shikigami-secrets.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
