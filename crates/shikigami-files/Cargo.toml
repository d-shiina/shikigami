[package]
name = "shikigami-files"
description = "File and folder steps for Shikigami (file.*): text, CSV, copy/move/delete, listing and zip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shikigami-core.workspace = true
shikigami-runtime.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
jiff.workspace = true
csv = "1.4.0"
encoding_rs = "0.8.35"
glob = "0.3.4"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
