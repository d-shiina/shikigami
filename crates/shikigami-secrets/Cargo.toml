[package]
name = "shikigami-secrets"
description = "Shikigami secret vault: login data encrypted in the workspace, key held by Windows Credential Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shikigami-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tempfile.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
aes-gcm = "0.10.3"
base64 = "0.22.1"
getrandom = "0.3.4"
hmac = "0.12.1"
sha1 = "0.10.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[lints]
workspace = true
